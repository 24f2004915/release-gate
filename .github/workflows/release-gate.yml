name: TDS GA7 Release Gate

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: "TDS identity: 24f2004915@ds.study.iitm.ac.in"
        run: echo "TDS identity verified"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run release gate tests
        run: npm test
